steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull ${_CACHE_IMAGE} || true

  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - docker/Dockerfile
      - --cache-from
      - ${_CACHE_IMAGE}
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --tag
      - ${_IMAGE}
      - --tag
      - ${_CACHE_IMAGE}
      - .
images:
  - ${_IMAGE}
  - ${_CACHE_IMAGE}
